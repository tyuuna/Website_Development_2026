<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap demo</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap JavaScript -->
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<!-- Bootstrap Task 1 -->
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="https://www.laurea.fi/">Laurea</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>
<!--Bootstrap Task 2-->
<div class="container">
    <div class="row">
        <div class="col-md-4 col-12">Column 1</div>
        <div class="col-md-4 col-12">Column 2</div>
        <div class="col-md-4 col-12">Column 3</div>
    </div>
</div>
<!--Bootstrap Task 3-->
<button class="btn btn-primary">Primary</button>
<button class="btn btn-secondary">Secondary</button>
<button class="btn btn-success">Success</button>
<!--Bootstrap Task 4-->
<div class="card mb-3" style="max-width: 540px;">
  <div class="row g-0">
    <div class="col-md-4">
      <img src="./IMG-20241010-WA0001.jpg" class="img-fluid rounded-start" alt="Image of me recycling cans">
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <h5 class="card-title">Tuna</h5>
        <p class="card-text">Here's a picture of me recycling cans.</p>
        <p class="card-text"><small class="text-body-secondary">This photo was taken in 2024</small></p>
      </div>
    </div>
  </div>
</div>
<!--Bootstrap Task 5-->
<div class="alert alert-success" role="alert">
    <h4 class="alert-heading">Well done!</h4>
    <hr>
    <p>Thank you for taking a look at my page made with bootstrap!</p>
</div>
</body>
</html>
